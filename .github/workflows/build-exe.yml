name: Build Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean build_exe.spec

      - name: Verify build artifact
        run: |
          if (Test-Path "dist/干扰小区周报全自动采集系统.exe") {
            Write-Host "Build succeeded: dist/干扰小区周报全自动采集系统.exe exists."
          } else {
            Write-Error "Build failed: dist/干扰小区周报全自动采集系统.exe not found."
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 干扰小区周报全自动采集系统-Windows
          path: dist/干扰小区周报全自动采集系统.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/干扰小区周报全自动采集系统.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
